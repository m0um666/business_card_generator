<!DOCTYPE html>
<html lang="fr">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Générateur de Carte de Visite</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <div id="dateTime"></div>

    <h1>
        ✨ Générateur de Carte de Visite
    </h1>

    <p>
        Créez une carte professionnelle élégante en quelques secondes
    </p>

</header>




<main>


<div class="app-container">



    <!-- FORMULAIRE -->

    <section class="form-card">


        <h2>
            📝 Vos informations
        </h2>



        <form id="businessCardForm">


            <label for="name">
                Nom complet
            </label>

            <input 
            type="text" 
            id="name" 
            placeholder="Votre nom complet" 
            required>



            <label for="phone">
                Téléphone
            </label>

            <input 
            type="tel" 
            id="phone" 
            placeholder="Votre numéro de téléphone" 
            required>



            <label for="email">
                E-mail
            </label>

            <input 
            type="email" 
            id="email" 
            placeholder="Votre adresse e-mail" 
            required>



            <label for="job">
                Métier
            </label>

            <input 
            type="text" 
            id="job" 
            placeholder="Votre métier" 
            required>



            <label for="postalCode">
                Code postal
            </label>

            <input 
            type="text" 
            id="postalCode" 
            placeholder="Votre code postal" 
            required>



            <label for="profilePic">
                Photo de profil
            </label>

            <input 
            type="file" 
            id="profilePic" 
            accept="image/*">



            <button type="submit">
                🚀 Générer la carte
            </button>


        </form>


    </section>






    <!-- APERCU CARTE -->


    <section class="preview-card">


        <h2>
            👀 Aperçu
        </h2>



        <div id="cardPreview">


            <img 
            id="cardPhoto" 
            alt="Photo de profil">



            <h2 id="cardName"></h2>


            <p id="cardPhone"></p>


            <p id="cardEmail"></p>


            <p id="cardJob"></p>


            <p id="cardPostalCode"></p>



        </div>





        <button id="downloadBtn" style="display:none;">
            📄 Télécharger en PDF
        </button>



    </section>




</div>



</main>

</footer>

</body>

</html>
